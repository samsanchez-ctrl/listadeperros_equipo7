# Service: un único punto de entrada que balancea entre todas las réplicas
apiVersion: v1
kind: Service
metadata:
  name: listadeperros
  labels:
    app: listadeperros
spec:
  type: ClusterIP
  selector:
    app: listadeperros
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics         # métricas del sidecar nginx-exporter (Prometheus)
      port: 9113
      targetPort: metrics
