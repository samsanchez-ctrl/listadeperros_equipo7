# Balanceador de carga: reparte las peticiones entre las réplicas del servicio "app".
# El DNS interno de Docker devuelve la IP de cada réplica; "resolver" + variable
# hace que Nginx vuelva a consultar el DNS si se escala el servicio.
server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        set $backend http://app:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Muestra qué réplica respondió (útil para demostrar el balanceo)
        add_header X-Replica $upstream_addr always;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
