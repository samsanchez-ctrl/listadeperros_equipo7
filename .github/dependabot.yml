# Dependabot: revisa cada semana si hay versiones nuevas o vulnerables
# y abre Pull Requests automáticos (que pasan por el mismo pipeline).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"
    groups:
      herramientas-dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(docker)"
