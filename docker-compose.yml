# docker-compose.yml — Orquestación local / entorno cloud simulado
#
#   usuario ──► lb (Nginx balanceador :8080) ──► app (3 réplicas)
#
# Levantar:   docker compose up -d --build
# Escalar:    docker compose up -d --scale app=5
# Bajar:      docker compose down

name: listadeperros

services:
  app:
    # En el pipeline IMAGE trae el tag con el SHA del commit (trazabilidad).
    image: ${IMAGE:-listadeperros:local}
    build:
      context: .
    deploy:
      replicas: 3                 # escalabilidad horizontal
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          memory: 16M
    restart: unless-stopped
    read_only: true               # sistema de archivos de solo lectura
    tmpfs:
      - /tmp                      # Nginx necesita escribir caché/PID en /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - interna
    # Sin "ports": las réplicas no se exponen directo, solo a través del balanceador

  lb:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/lb-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - interna

networks:
  interna:
    driver: bridge
