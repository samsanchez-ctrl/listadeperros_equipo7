name: CI/CD — Lista de Perros

# ——————————————————————————————————————————————————————————————————————————————
# Flujo (EP3):
#
#   1 calidad ──────┐
#   2 seguridad ────┼─► 4 build (Docker + gate Trivy) ─► 5 staging (Compose) ─► 6 observabilidad ─┐
#   3 cumplimiento ─┘                                                                              │
#                                     8 publicar (GHCR) ◄── 7 producción (Kubernetes + Prometheus) ◄┘
#
# - Pull Requests y develop: etapas 1 a 6.  Push a main: todas.
# - Cada etapa depende de la anterior: si una falla, NADA se despliega.
# - Cada etapa deja métricas (cobertura, tiempos, vulnerabilidades, políticas)
#   que la etapa 6 envía a Prometheus y muestra en el dashboard de Grafana.
# - Ejecución manual (Actions → Run workflow) permite SIMULAR una falla crítica
#   de calidad o de seguridad para demostrar que el pipeline se detiene.
# ——————————————————————————————————————————————————————————————————————————————

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      simular_falla:
        description: "Simular una falla crítica para demostrar que el pipeline se detiene"
        type: choice
        default: ninguna
        options: [ninguna, calidad, seguridad]

# Si llega un commit nuevo a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principio de mínimo privilegio: por defecto el token solo puede leer
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  IMAGE: listadeperros:${{ github.sha }}
  SIMULAR_FALLA: ${{ inputs.simular_falla || 'ninguna' }}

jobs:
  # ——————————————————————————————————————————————
  calidad:
    name: 1 · Lint y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⏱️ Inicio de la etapa
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: 📥 Clonar repositorio
        uses: actions/checkout@v5

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Instalar dependencias (versiones exactas del lockfile)
        run: npm ci

      - name: 🧹 ESLint
        run: npm run lint

      - name: 🧪 Jest con cobertura (umbral mínimo 80% en package.json)
        run: |
          if [ "$SIMULAR_FALLA" = "calidad" ]; then
            echo "::warning title=Simulación::Se exige 101% de cobertura para demostrar que el pipeline se detiene."
            npm run test:ci -- --coverageThreshold='{"global":{"lines":101}}'
          else
            npm run test:ci
          fi

      - name: 📈 Métricas de calidad para el dashboard
        run: |
          mkdir -p metricas
          node monitoring/scripts/metricas-calidad.mjs > metricas/calidad.prom
          echo "ci_etapa_duracion_segundos{etapa=\"calidad\"} $(( $(date +%s) - INICIO ))" >> metricas/calidad.prom
          cat metricas/calidad.prom

      - name: 📊 Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ github.sha }}
          path: coverage/
          retention-days: 14

      - name: 📤 Subir métricas
        uses: actions/upload-artifact@v4
        with:
          name: metricas-calidad-${{ github.sha }}
          path: metricas/
          retention-days: 7

  # ——————————————————————————————————————————————
  seguridad:
    name: 2 · Seguridad (npm audit + Snyk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: ⏱️ Inicio de la etapa
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: 📥 Clonar repositorio
        uses: actions/checkout@v5

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔒 npm audit (bloquea vulnerabilidades altas o críticas)
        run: npm audit --audit-level=high

      - name: 🔑 Verificar que exista el token de Snyk
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error title=Falta SNYK_TOKEN::Agrega el secret SNYK_TOKEN en Settings → Secrets and variables → Actions (y también en Dependabot)."
            exit 1
          fi

      - name: 🛠️ Instalar Snyk CLI
        run: npm install -g snyk

      - name: 🐍 Snyk Open Source — dependencias
        run: snyk test --severity-threshold=high

      - name: 🔍 Snyk Code — análisis estático del código
        run: snyk code test --severity-threshold=high

      - name: 📈 Métricas de la etapa
        run: |
          mkdir -p metricas
          echo "ci_etapa_duracion_segundos{etapa=\"seguridad\"} $(( $(date +%s) - INICIO ))" > metricas/seguridad.prom

      - name: 📤 Subir métricas
        uses: actions/upload-artifact@v4
        with:
          name: metricas-seguridad-${{ github.sha }}
          path: metricas/
          retention-days: 7

  # ——————————————————————————————————————————————
  cumplimiento:
    name: 3 · Cumplimiento y auditoría (políticas + secretos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⏱️ Inicio de la etapa
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: 📥 Clonar repositorio (historial completo para auditar commits)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🎭 Simulación de falla de seguridad (solo ejecución manual)
        if: env.SIMULAR_FALLA == 'seguridad'
        run: |
          echo "::warning title=Simulación::Se agrega una clave privada falsa para demostrar que el pipeline se detiene."
          mkdir -p simulacion
          # El encabezado se arma por partes para que el propio workflow no sea detectado como secreto
          TIPO="RSA PRIVATE"
          {
            echo "-----BEGIN ${TIPO} KEY-----"
            head -c 600 /dev/urandom | base64 -w 64
            echo "-----END ${TIPO} KEY-----"
          } > simulacion/credencial-filtrada.pem

      - name: 📝 Título del Pull Request (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$TITULO" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|release)(\([a-zA-Z0-9./-]+\))?!?:\ .+ ]]; then
            echo "✅ Título válido: $TITULO"
          else
            echo "::error title=Título de PR inválido::'$TITULO' debe seguir Conventional Commits (ej: 'feat: agrega dashboard')."
            exit 1
          fi

      - name: 🔐 Gitleaks — secretos en el código y en todo el historial
        run: |
          GITLEAKS="docker run --rm -v $PWD:/repo -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=* \
            ghcr.io/gitleaks/gitleaks:v8.28.0"
          echo "▶ Archivos actuales"
          $GITLEAKS dir --redact --verbose --exit-code 1 /repo
          echo "▶ Historial de commits"
          $GITLEAKS git --redact --verbose --exit-code 1 /repo

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 📋 Auditoría de políticas (CIS, Pod Security, OWASP CI/CD, ISO 27001)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p metricas
          node scripts/auditoria.mjs metricas/cumplimiento.prom

      - name: 📈 Métricas de la etapa
        run: echo "ci_etapa_duracion_segundos{etapa=\"cumplimiento\"} $(( $(date +%s) - INICIO ))" >> metricas/cumplimiento.prom

      - name: 📄 Guardar reporte de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-${{ github.sha }}
          path: reportes/
          retention-days: 30

      - name: 📤 Subir métricas
        uses: actions/upload-artifact@v4
        with:
          name: metricas-cumplimiento-${{ github.sha }}
          path: metricas/
          retention-days: 7

  # ——————————————————————————————————————————————
  build:
    name: 4 · Build de imagen Docker + gate de seguridad Trivy
    needs: [calidad, seguridad, cumplimiento]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⏱️ Inicio de la etapa
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: 📥 Clonar repositorio
        uses: actions/checkout@v5

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Construir imagen (etiquetada con el SHA del commit)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # trivy-action fijado a 0.35.0 (release inmutable) y Trivy v0.69.3:
      # versiones seguras tras el incidente de cadena de suministro de marzo 2026.
      - name: 🛡️ Escanear imagen con Trivy (reporte JSON)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          version: v0.69.3
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: "0"

      - name: 🚦 Gate de seguridad (detiene el pipeline si hay HIGH/CRITICAL)
        run: |
          mkdir -p metricas
          node scripts/gate-trivy.mjs trivy.json metricas/build.prom

      - name: 📈 Métricas de la etapa
        run: |
          echo "ci_imagen_tamano_bytes $(docker image inspect "$IMAGE" --format '{{.Size}}')" >> metricas/build.prom
          echo "ci_etapa_duracion_segundos{etapa=\"build\"} $(( $(date +%s) - INICIO ))" >> metricas/build.prom
          docker image ls listadeperros

      - name: 💾 Guardar imagen para las etapas de despliegue
        run: docker save "$IMAGE" | gzip > imagen.tar.gz

      - name: 📤 Subir imagen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: imagen-${{ github.sha }}
          path: imagen.tar.gz
          retention-days: 7

      - name: 📤 Subir métricas y reporte de Trivy
        uses: actions/upload-artifact@v4
        with:
          name: metricas-build-${{ github.sha }}
          path: metricas/
          retention-days: 7

  # ——————————————————————————————————————————————
  staging:
    name: 5 · Despliegue staging (Docker Compose, 3 réplicas)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    steps:
      - name: ⏱️ Inicio de la etapa
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: 📥 Clonar repositorio
        uses: actions/checkout@v5

      - name: 📥 Descargar imagen construida
        uses: actions/download-artifact@v4
        with:
          name: imagen-${{ github.sha }}

      - name: 🐳 Cargar imagen en Docker
        run: gunzip -c imagen.tar.gz | docker load

      - name: 🚀 Levantar entorno y medir el tiempo de despliegue
        run: |
          DESPLIEGUE_INICIO=$(date +%s.%N)
          docker compose up -d --no-build --wait --wait-timeout 90
          DURACION=$(echo "$(date +%s.%N) - $DESPLIEGUE_INICIO" | bc)
          echo "⏱️ Tiempo de despliegue: ${DURACION}s"
          mkdir -p metricas
          echo "ci_despliegue_duracion_segundos{entorno=\"staging\"} $DURACION" > metricas/staging.prom

      - name: 📋 Estado de los contenedores
        run: docker compose ps

      - name: ✅ Smoke tests
        run: |
          set -e
          curl -fsS http://localhost:8080/ | grep -q "Lista de Perros"   && echo "✅ index.html responde"
          curl -fsS http://localhost:8080/logica.js -o /dev/null            && echo "✅ logica.js disponible"
          curl -fsS http://localhost:8080/health | grep -q ok               && echo "✅ /health OK"
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy" && echo "✅ Cabecera CSP presente"
          echo "Reparto de carga entre réplicas (10 peticiones):"
          for i in $(seq 1 10); do curl -fsSI http://localhost:8080/ | grep -i x-replica; done | sort | uniq -c

      - name: 📈 Métricas de la etapa
        run: echo "ci_etapa_duracion_segundos{etapa=\"staging\"} $(( $(date +%s) - INICIO ))" >> metricas/staging.prom

      - name: 📤 Subir métricas
        uses: actions/upload-artifact@v4
        with:
          name: metricas-staging-${{ github.sha }}
          path: metricas/
          retention-days: 7

      - name: 🔎 Logs si algo falló
        if: failure()
        run: docker compose logs

      - name: 🧹 Bajar entorno
        if: always()
        run: docker compose down

  # ——————————————————————————————————————————————
  observabilidad:
    name: 6 · Observabilidad (Prometheus, Grafana, Loki) y métricas del pipeline
    needs: [build, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v5

      - name: 📥 Descargar imagen construida
        uses: actions/download-artifact@v4
        with:
          name: imagen-${{ github.sha }}

      - name: 📥 Descargar métricas de todas las etapas
        uses: actions/download-artifact@v4
        with:
          pattern: metricas-*-${{ github.sha }}
          path: metricas
          merge-multiple: true

      # cAdvisor (CPU/memoria por contenedor) necesita el almacenamiento clásico overlay2;
      # Docker 29 usa por defecto el de containerd. Se cambia ANTES de cargar la imagen.
      - name: 🔧 Docker con almacenamiento overlay2 (requerido por cAdvisor)
        run: |
          CONFIG=/etc/docker/daemon.json
          [ -s "$CONFIG" ] || echo '{}' | sudo tee "$CONFIG" > /dev/null
          jq '. + {"features": ((.features // {}) + {"containerd-snapshotter": false})}' "$CONFIG" | sudo tee "$CONFIG.nuevo" > /dev/null
          sudo mv "$CONFIG.nuevo" "$CONFIG"
          sudo systemctl restart docker
          for i in $(seq 1 30); do docker info > /dev/null 2>&1 && break; sleep 1; done
          docker info --format 'Docker {{.ServerVersion}} · almacenamiento {{.Driver}}'

      - name: 🐳 Cargar imagen en Docker
        run: gunzip -c imagen.tar.gz | docker load

      - name: 🚀 Levantar app + stack de monitoreo
        run: |
          $COMPOSE up -d --no-build --wait --wait-timeout 180
          $COMPOSE ps
          echo "Docker: $(docker info --format '{{.ServerVersion}} · almacenamiento {{.Driver}}')"

      - name: 🩺 Diagnóstico de cAdvisor
        run: |
          sleep 20
          $COMPOSE logs cadvisor --tail=15
          echo "▶ Etiquetas de servicio que ve cAdvisor:"
          curl -fsS --get http://localhost:9090/api/v1/label/container_label_com_docker_compose_service/values | jq -c '.data'

      - name: 📤 Enviar métricas del pipeline al Pushgateway
        run: |
          {
            cat metricas/*.prom
            echo "ci_ultima_ejecucion_timestamp_seconds $(date +%s)"
            echo "ci_info{commit=\"${GITHUB_SHA::7}\",rama=\"${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}\",ejecucion=\"${GITHUB_RUN_NUMBER}\",autor=\"${GITHUB_ACTOR}\"} 1"
          } | sort > metricas-pipeline.prom
          cat metricas-pipeline.prom
          curl -fsS --retry 10 --retry-connrefused --retry-delay 3 \
            --data-binary @metricas-pipeline.prom \
            http://localhost:9091/metrics/job/pipeline_cicd

      - name: 🚦 Generar tráfico de prueba (incluye errores 404 controlados)
        run: bash monitoring/scripts/generar-trafico.sh http://localhost:8080 150

      - name: ✅ Verificar métricas, logs y alertas
        run: bash monitoring/scripts/verificar-observabilidad.sh

      - name: 📸 Captura del dashboard de Grafana
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          node monitoring/scripts/captura-dashboard.mjs dashboard-grafana.png

      - name: 🧾 Exportar evidencias (alertas, targets, métricas)
        if: always()
        run: |
          mkdir -p evidencias
          cp metricas-pipeline.prom evidencias/ 2>/dev/null || true
          cp dashboard-grafana.png evidencias/ 2>/dev/null || true
          curl -fsS http://localhost:9090/api/v1/targets | jq '[.data.activeTargets[] | {job: .labels.job, estado: .health, url: .scrapeUrl}]' > evidencias/prometheus-targets.json || true
          curl -fsS http://localhost:9090/api/v1/rules  | jq '[.data.groups[].rules[] | {alerta: .name, estado: .state}]' > evidencias/prometheus-alertas.json || true
          curl -fsS -G http://localhost:3100/loki/api/v1/query_range --data-urlencode 'query={service="lb", status=~"4.."}' --data-urlencode 'limit=20' \
            | jq -r '.data.result[].values[][1]' > evidencias/logs-errores.txt || true

      - name: 📤 Subir evidencias de observabilidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observabilidad-${{ github.sha }}
          path: evidencias/
          retention-days: 30

      - name: 🔎 Logs si algo falló
        if: failure()
        run: $COMPOSE logs --tail=80

      - name: 🧹 Bajar entorno
        if: always()
        run: $COMPOSE down -v

  # ——————————————————————————————————————————————
  produccion:
    name: 7 · Despliegue producción (Kubernetes + Prometheus Operator)
    needs: [staging, observabilidad]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v5

      - name: 📥 Descargar imagen construida
        uses: actions/download-artifact@v4
        with:
          name: imagen-${{ github.sha }}

      - name: 🐳 Cargar imagen en Docker
        run: gunzip -c imagen.tar.gz | docker load

      - name: ☸️ Crear cluster Kubernetes (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: listadeperros

      - name: 📊 Instalar monitoreo del cluster (kube-prometheus-stack)
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoreo prometheus-community/kube-prometheus-stack \
            --namespace monitoreo --create-namespace \
            -f k8s/monitoring/valores-kube-prometheus-stack.yaml \
            --wait --timeout 10m
          helm list -n monitoreo

      - name: 📦 Cargar imagen en el cluster
        run: kind load docker-image "$IMAGE" --name listadeperros

      - name: 🚀 Desplegar la app y su monitoreo (medir tiempo de despliegue)
        run: |
          sed -i "s|image: listadeperros:local|image: ${IMAGE}|" k8s/deployment.yaml
          sed -i "s|listadeperros/commit: \"local\"|listadeperros/commit: \"${GITHUB_SHA}\"|" k8s/deployment.yaml
          INICIO=$(date +%s.%N)
          kubectl apply -f k8s/
          kubectl apply -f k8s/monitoring/servicemonitor.yaml -f k8s/monitoring/alertas.yaml
          kubectl annotate deployment/listadeperros \
            kubernetes.io/change-cause="commit ${GITHUB_SHA::7} por ${GITHUB_ACTOR} (run ${GITHUB_RUN_NUMBER})" --overwrite
          kubectl rollout status deployment/listadeperros --timeout=180s
          DURACION=$(echo "$(date +%s.%N) - $INICIO" | bc)
          echo "DURACION_K8S=$DURACION" >> "$GITHUB_ENV"
          echo "⏱️ Tiempo de despliegue en Kubernetes: ${DURACION}s"

      - name: ✅ Smoke test dentro del cluster
        run: |
          kubectl port-forward service/listadeperros 8080:80 > /dev/null 2>&1 &
          sleep 3
          curl -fsS http://localhost:8080/ | grep -q "Lista de Perros" && echo "✅ App responde en Kubernetes"
          curl -fsS http://localhost:8080/health | grep -q ok        && echo "✅ /health OK"

      - name: 🔭 Verificar que Prometheus del cluster monitorea la app
        run: |
          kubectl -n monitoreo port-forward service/prometheus-operated 9090:9090 > /dev/null 2>&1 &
          sleep 5
          consulta() { curl -fsS --get http://localhost:9090/api/v1/query --data-urlencode "query=$1" | jq -r '.data.result[0].value[1] // "0"'; }
          for i in $(seq 1 24); do
            OBJETIVOS=$(consulta 'sum(up{service="listadeperros"})')
            [ "${OBJETIVOS%.*}" -ge 3 ] && break
            echo "Esperando que Prometheus descubra las 3 réplicas... ($OBJETIVOS)"; sleep 10
          done
          NGINX=$(consulta 'min(nginx_up{service="listadeperros"})')
          MEMORIA=$(consulta 'sum(container_memory_working_set_bytes{pod=~"listadeperros-.*", container="web"})')
          REGLAS=$(curl -fsS http://localhost:9090/api/v1/rules | jq '[.data.groups[] | select(.name=="listadeperros-k8s") | .rules[]] | length')
          {
            echo "## 🔭 Monitoreo en producción (Kubernetes)"
            echo "| Verificación | Valor |"
            echo "|---|---|"
            echo "| Réplicas monitoreadas por Prometheus | $OBJETIVOS |"
            echo "| Exportador Nginx activo | $NGINX |"
            echo "| Memoria total de las réplicas (bytes) | $MEMORIA |"
            echo "| Reglas de alerta cargadas | $REGLAS |"
            echo "| Tiempo de despliegue | ${DURACION_K8S}s |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${OBJETIVOS%.*}" -lt 3 ] || [ "$NGINX" != "1" ] || [ "$REGLAS" -lt 1 ]; then
            echo "::error title=Monitoreo incompleto::Prometheus no está monitoreando correctamente la app en producción."
            exit 1
          fi
          echo "✅ Producción monitoreada: $OBJETIVOS réplicas, $REGLAS reglas de alerta."

      - name: 📋 Estado del despliegue
        if: always()
        run: |
          kubectl get deployment,pods,service,hpa,pdb,servicemonitor,prometheusrule -o wide
          kubectl rollout history deployment/listadeperros

  # ——————————————————————————————————————————————
  publicar:
    name: 8 · Publicar imagen en GitHub Container Registry
    needs: produccion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write          # único job con permiso de escritura en paquetes
    steps:
      - name: 📥 Descargar imagen construida
        uses: actions/download-artifact@v4
        with:
          name: imagen-${{ github.sha }}

      - name: 🐳 Cargar imagen en Docker
        run: gunzip -c imagen.tar.gz | docker load

      - name: 🔐 Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Etiquetar y publicar (sha + latest)
        run: |
          DESTINO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/listadeperros"
          docker tag "$IMAGE" "$DESTINO:${GITHUB_SHA}"
          docker tag "$IMAGE" "$DESTINO:latest"
          docker push "$DESTINO:${GITHUB_SHA}"
          docker push "$DESTINO:latest"
          echo "DESTINO=$DESTINO" >> "$GITHUB_ENV"

      - name: 🧾 Resumen de trazabilidad
        run: |
          {
            echo "## 🧾 Trazabilidad del despliegue"
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Autor del push | @${GITHUB_ACTOR} |"
            echo "| Ejecución | #${GITHUB_RUN_NUMBER} |"
            echo "| Imagen | \`${DESTINO}:${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
