apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pushgateway-datos
  namespace: monitoreo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: monitoreo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.1
          args:
            - --persistence.file=/data/metrics.db
            - --persistence.interval=30s
          ports:
            - name: http
              containerPort: 9091
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: datos
              mountPath: /data
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: pushgateway-datos
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: monitoreo
  labels:
    app: pushgateway
spec:
  type: ClusterIP
  selector:
    app: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: 9091
