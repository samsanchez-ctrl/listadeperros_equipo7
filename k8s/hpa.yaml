# HorizontalPodAutoscaler: escala entre 3 y 10 réplicas según el uso de CPU.
# Requiere metrics-server en el cluster (en un cluster local "kind" puede mostrar <unknown>).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: listadeperros
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: listadeperros
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
