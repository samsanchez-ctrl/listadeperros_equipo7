# nginx.conf — servidor de la app dentro del contenedor (puerto 8080, no-root)

# Logs de acceso en formato JSON: Alloy los recolecta y Loki los guarda,
# así se pueden filtrar y contar errores por código HTTP en Grafana.
log_format json_logs escape=json '{"time":"$time_iso8601","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"user_agent":"$http_user_agent"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de Nginx
    server_tokens off;
    access_log /var/log/nginx/access.log json_logs;

    # ——— Cabeceras de seguridad ———
    # CSP: solo se permite cargar scripts/estilos propios, imágenes de dog.ceo
    # y llamadas fetch a la API de dog.ceo.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://images.dog.ceo; connect-src https://dog.ceo; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Endpoint de salud para Docker, Compose y Kubernetes
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos estáticos con caché corta (se versionan por imagen)
    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Comprimir respuestas de texto
    gzip on;
    gzip_types text/plain text/css application/javascript;
}

# Puerto interno de métricas: nginx-prometheus-exporter lee stub_status
# (conexiones y peticiones) y lo expone a Prometheus. No se publica hacia afuera.
server {
    listen 8081;
    server_tokens off;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
