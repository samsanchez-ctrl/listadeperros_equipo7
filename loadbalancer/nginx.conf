# Balanceador de carga: reparte las peticiones entre las réplicas del servicio "app".
# El DNS interno de Docker devuelve la IP de cada réplica; "resolver" + variable
# hace que Nginx vuelva a consultar el DNS si se escala el servicio.
# Logs de acceso en formato JSON: Alloy los recolecta y Loki los guarda,
# así se pueden filtrar y contar errores por código HTTP en Grafana.
log_format json_logs escape=json '{"time":"$time_iso8601","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"user_agent":"$http_user_agent"}';

server {
    listen 8080;
    server_tokens off;
    access_log /var/log/nginx/access.log json_logs;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        set $backend http://app:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Muestra qué réplica respondió (útil para demostrar el balanceo)
        add_header X-Replica $upstream_addr always;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}

# Métricas del balanceador (todo el tráfico pasa por aquí) para nginx-prometheus-exporter
server {
    listen 8081;
    server_tokens off;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
