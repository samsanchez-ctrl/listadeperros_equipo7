# Deployment: mantiene 3 réplicas de la app, con actualización sin caída (rolling update)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: listadeperros
  labels:
    app: listadeperros
spec:
  replicas: 3
  revisionHistoryLimit: 5          # permite hacer rollback a versiones anteriores
  selector:
    matchLabels:
      app: listadeperros
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # nunca baja de 3 réplicas disponibles durante un despliegue
      maxSurge: 1
  template:
    metadata:
      labels:
        app: listadeperros
      annotations:
        # Trazabilidad: el pipeline reemplaza este valor por el SHA del commit
        listadeperros/commit: "local"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # El pipeline reemplaza esta imagen por la etiquetada con el SHA del commit
          image: listadeperros:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: status        # stub_status interno para el exportador
              containerPort: 8081
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:          # recibe tráfico solo cuando está lista
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:           # se reinicia si deja de responder
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # Sidecar de observabilidad: traduce stub_status de Nginx a métricas Prometheus
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.4.2
          args: ["--nginx.scrape-uri=http://127.0.0.1:8081/stub_status"]
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
