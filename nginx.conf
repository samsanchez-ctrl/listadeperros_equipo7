# nginx.conf — servidor de la app dentro del contenedor (puerto 8080, no-root)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de Nginx
    server_tokens off;

    # ——— Cabeceras de seguridad ———
    # CSP: solo se permite cargar scripts/estilos propios, imágenes de dog.ceo
    # y llamadas fetch a la API de dog.ceo.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://images.dog.ceo; connect-src https://dog.ceo; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Endpoint de salud para Docker, Compose y Kubernetes
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos estáticos con caché corta (se versionan por imagen)
    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Comprimir respuestas de texto
    gzip on;
    gzip_types text/plain text/css application/javascript;
}
